
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>College Result Portal</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #cbd5e1;
      --error: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px; 
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s ease;
      background-color: #f8fafc;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      background-color: #ffffff;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:active {
      transform: scale(0.98);
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--error);
      min-height: 20px;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>College Result Portal</h1>
    <p class="subtitle">Enter your college code below to view your result document.</p>

    <div class="form-group">
      <label for="collegeCode">College Code</label>
      <input type="text" id="collegeCode" placeholder="Enter code (e.g. 1305)" autocomplete="off" autocapitalize="none">
    </div>

    <button id="submitBtn" onclick="fetchDocument()">Submit</button>

    <div id="message"></div>
  </div>

  <script>
    // REPLACE WITH YOUR PUBLISHED APPS SCRIPT WEB APP URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzik3RllZCBauVYTdpmsZ-drPFkyLkWA24q0d9W_YufpJy0KVaHOq54Mu6Fz6v7LQ9fag/exec";

    async function fetchDocument() {
      const codeInput = document.getElementById("collegeCode").value.trim();
      const messageDiv = document.getElementById("message");
      const submitBtn = document.getElementById("submitBtn");

      messageDiv.textContent = "";

      if (!codeInput) {
        messageDiv.textContent = "Please enter a college code.";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Searching...';

      try {
        const response = await fetch(`${SCRIPT_URL}?code=${encodeURIComponent(codeInput)}`);
        const data = await response.json();

        if (data.status === "success" && data.pdfUrl) {
          messageDiv.style.color = "#16a34a";
          messageDiv.textContent = "Document found! Redirecting...";
          
          setTimeout(() => {
            window.location.href = data.pdfUrl;
          }, 600);
        } else {
          messageDiv.style.color = "var(--error)";
          messageDiv.textContent = data.message || "College code not found.";
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit";
        }
      } catch (error) {
        messageDiv.style.color = "var(--error)";
        messageDiv.textContent = "Connection error. Please try again.";
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit";
      }
    }
  </script>
</body>
</html>
